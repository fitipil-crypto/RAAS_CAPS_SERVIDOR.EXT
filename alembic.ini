# Configuração do Alembic (migrações versionadas do banco).
#
# O endereço do banco NÃO fica aqui: vem de DATABASE_URL, o mesmo que a
# aplicação usa (ver migrations/env.py). Uso no dia a dia:
#
#   alembic revision --autogenerate -m "descricao curta"   # nova migração
#   alembic upgrade head                                   # aplicar
#   alembic downgrade -1                                   # desfazer a última
#   alembic current / alembic history                      # consultar
#
# A aplicação também aplica as migrações pendentes sozinha ao iniciar.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
